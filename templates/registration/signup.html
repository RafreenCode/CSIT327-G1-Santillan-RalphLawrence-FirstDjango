{% extends "base.html" %}
{% block title %}Sign Up | CampusConnect{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="text-center mb-4"><p class="eyebrow">Find your place</p><h1 class="fw-bold">Join your campus community.</h1><p class="text-muted">Create an account to get connected.</p></div><div class="card p-4 p-md-5"><form method="post" class="form-fields">{% csrf_token %}{% include "includes/form_fields.html" %}<button class="btn btn-primary w-100 mt-2" type="submit">Create account &rarr;</button></form><p class="text-center small text-muted mt-4 mb-0">Already a member? <a href="{% url 'login' %}" class="fw-semibold">Log in</a></p></div></div>
{% endblock %}
